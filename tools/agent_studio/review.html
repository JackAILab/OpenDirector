<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisualAgent · 独立审阅</title><style>
@font-face{font-family:Studio;src:url('/creative/font.woff2')}*{box-sizing:border-box}body{margin:0;background:#f4f4ee;color:#25352c;font:14px Studio,system-ui}header{display:flex;justify-content:space-between;padding:18px 24px;background:#fafbf7;border-bottom:1px solid #dce1d7}a{color:#426137}main{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:250px 1fr;gap:22px}section,aside{padding:18px;background:#fafbf7;border:1px solid #dce1d7;border-radius:12px}h1{font-size:19px;margin:0}h2{font-size:17px}button,input,textarea,select{font:inherit}button{cursor:pointer;padding:10px;border:1px solid #d8ded4;border-radius:8px;background:white;color:#294a37}button:disabled{opacity:.45}textarea,select{padding:10px;border:1px solid #d8ded4;border-radius:8px;background:white;width:100%}textarea{resize:vertical}.row{display:flex;gap:10px;align-items:center}.queue button{width:100%;text-align:left;margin-bottom:9px}.muted{font-size:12px;color:#73806e;line-height:1.8}video{width:100%;max-height:460px;background:#222c25;border-radius:10px}.rubric{display:grid;grid-template-columns:1fr 100px;gap:10px;margin:18px 0}.rubric textarea{grid-column:1/-1}.checks label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:12px;line-height:1.8}details{margin:16px 0}summary{cursor:pointer}.hidden{display:none}#submit{background:#294a37;color:white}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}header{padding:14px}.row{flex-wrap:wrap}}
</style><header><h1>VisualAgent · 独立质量审阅</h1><a href="/creative">返回创作台</a></header><main><aside><h2>已授权的当前作品</h2><p class="muted">仅展示授权训练审阅的版本，排除你本人创建的作品。</p><div id="queue" class="queue"></div><button id="more" class="hidden">加载下一页</button><p id="queueStatus" class="muted"></p></aside><section><p id="status" role="status">请从左侧选择作品。需要管理员权限。</p><div id="body" class="hidden"><h2 id="title"></h2><p id="version" class="muted"></p><video id="film" controls preload="metadata"></video><p id="mediaStatus" class="muted"></p><details><summary>商品事实与方案</summary><pre id="brief"></pre><pre id="shots"></pre><pre id="decisions"></pre></details><p class="muted">逐项写出可见或可听的依据。请另行核对商品资料；方案中的主张不是已验证事实。3分表示基本达标，4–5分用于区分较强作品。通过后仍需隐私、使用权及训练数据审查。</p><div id="ratings"></div><div class="checks"><label><input id="watched" type="checkbox">已完整观看成片</label><label><input id="heard" type="checkbox">已实际听过音轨，检查发音、音效与音乐</label><label><input id="facts" type="checkbox">已对照商品资料核实事实与主张</label></div><div class="row"><select id="decision" aria-label="独立审阅结论"><option value="needs_changes">需要修改</option><option value="rejected">不通过</option><option value="passed">独立质量通过</option></select><button id="submit">保存独立审阅</button></div><p id="existing" class="muted"></p></div></section></main><script>
const $=id=>document.getElementById(id),key=sessionStorage.getItem('h3_api_key')||'';
const labels={product_fidelity:'商品外观与一致性',claim_accuracy:'卖点与事实准确性',narrative:'广告机制与叙事',visual_quality:'画面、动作与衔接',audio_quality:'旁白、音乐与音效'};
let selected=null,epoch=0,objectURL='',cursor=null;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
async function api(path,method='GET',body){const r=await fetch('/creative/api/admin/learning'+path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求未完成');return d}
async function queue(next=false){$('more').disabled=true;try{const d=await api('/queue'+(next&&cursor?'?cursor='+cursor:''));if(!next)$('queue').replaceChildren();for(const item of d.items){const b=el('button',item.title+' · 版本 '+item.revision);b.onclick=()=>open(item.project);$('queue').append(b)}cursor=d.next_cursor;$('more').classList.toggle('hidden',cursor===null);$('queueStatus').textContent=$('queue').children.length?'选择作品后核对实际成片版本。':'当前没有待审阅的授权作品。'}catch(e){$('queueStatus').textContent=e.message}finally{$('more').disabled=false}}
async function open(pid){const t=++epoch;selected=null;$('submit').disabled=true;$('body').classList.add('hidden');$('status').textContent='正在核对成片…';$('film').pause();$('film').removeAttribute('src');$('film').load();if(objectURL)URL.revokeObjectURL(objectURL);objectURL='';
 try{const d=await api('/projects/'+pid);if(t!==epoch)return;selected=d;$('title').textContent=d.brief.product||'广告作品';$('version').textContent='版本 '+d.revision+' · 成片 '+d.artifact_sha256.slice(0,12);$('brief').textContent=JSON.stringify(d.brief,null,2);$('shots').textContent=d.shots.map(s=>`${s.start}–${s.start+s.duration}秒\n画面：${s.prompt}\n声音：${s.audio_prompt}\n字幕：${s.caption}`).join('\n\n');$('decisions').textContent=JSON.stringify(d.decisions,null,2);$('ratings').replaceChildren();for(const id of d.rubric){const box=el('div');box.className='rubric';box.append(el('strong',labels[id]||id));const score=el('select');score.id='score-'+id;score.setAttribute('aria-label',labels[id]+'评分');score.append(new Option('请选择',''));for(let i=0;i<=5;i++)score.append(new Option(i+' 分',String(i)));const note=el('textarea');note.id='evidence-'+id;note.rows=2;note.maxLength=500;note.setAttribute('aria-label',labels[id]+'依据');note.placeholder='写出实际看到或听到的具体证据';box.append(score,note);$('ratings').append(box)}for(const id of ['watched','heard','facts'])$(id).checked=false;$('decision').value='needs_changes';$('existing').textContent=d.assessment?'已有结论：'+d.assessment.decision+'；本次保存会追加新记录。':'尚无独立质量结论。';$('body').classList.remove('hidden');$('status').textContent='当前版本已核对，请完整观看后评价。';$('mediaStatus').textContent='正在读取视频…';
 const r=await fetch('/creative/api/admin/learning/projects/'+pid+'/media?revision='+d.revision+'&digest='+d.artifact_sha256,{headers:{Authorization:'Bearer '+key},cache:'no-store',signal:AbortSignal.timeout(120000)});if(!r.ok)throw Error('视频暂不可读取，请重新选择作品核对版本');const blob=await r.blob();if(t!==epoch)return;objectURL=URL.createObjectURL(blob);$('film').src=objectURL;$('mediaStatus').textContent='播放完整成片，确认声音已开启。';
 }catch(e){if(t===epoch){$('status').textContent=e.message;$('submit').disabled=true}}finally{if(t===epoch&&$('film').getAttribute('src'))$('submit').disabled=false}}
$('submit').onclick=async()=>{const d=selected,t=epoch;if(!d)return;const ratings={};for(const id of d.rubric){if($('score-'+id).value===''){ $('status').textContent='请填写每项评分及依据。';return}ratings[id]={score:Number($('score-'+id).value),evidence:$('evidence-'+id).value}}$('submit').disabled=true;try{const r=await api('/projects/'+d.project+'/assessment','POST',{revision:d.revision,artifact_sha256:d.artifact_sha256,decision:$('decision').value,ratings,checks:{full_video_watched:$('watched').checked,audio_listened:$('heard').checked,product_facts_checked:$('facts').checked}});if(t===epoch){$('status').textContent='已追加独立审阅记录；训练资格仍未开放。';$('existing').textContent='最新结论：'+r.decision}}catch(e){if(t===epoch)$('status').textContent=e.message}finally{if(t===epoch)$('submit').disabled=false}};
$('more').onclick=()=>queue(true);queue();
</script></html>
