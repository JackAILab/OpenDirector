<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · VisualAgent</title>
<style>
@font-face{font-family:Studio;src:url('/creative/font.woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#111;color:#eee;font:15px Studio,system-ui,sans-serif;display:grid;place-items:center;padding:80px 20px}a{color:inherit;text-decoration:none}header{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between}header strong{font-size:22px;font-style:italic}.card{width:min(480px,100%);background:#191919;border:1px solid #2c2c2c;border-radius:28px;padding:52px 42px;text-align:center}.brand{font-size:24px;font-weight:750;font-style:italic}h1{font-size:30px;margin:25px 0 32px}form{text-align:left;display:grid;gap:18px}label{display:grid;gap:8px;color:#aaa;font-size:13px}input{width:100%;padding:14px;background:#262626;border:1px solid #3b3b3b;border-radius:10px;color:#fff;font:inherit}input:focus{outline:2px solid #4bd8f5}button{cursor:pointer;border:0;border-radius:10px;padding:13px;color:#eee;background:#292929;font:inherit}button:disabled{opacity:.45;cursor:not-allowed}.submit{background:#eee;color:#111;font-weight:600}.links,.methods{display:flex;justify-content:center;gap:12px;margin-top:20px}.links button{background:none;color:#aaa;font-size:13px;padding:4px}.methods{border-top:1px solid #333;padding-top:25px;margin-top:35px}.methods button{flex:1;font-size:13px;line-height:1.8}.methods span{display:block;font-size:23px}.methods small{display:block;font-size:11px}#status{min-height:20px;color:#f3bd9e;font-size:13px;line-height:1.7}[hidden]{display:none!important}#gate{padding:16px;background:#222;border-radius:12px;margin-bottom:20px;text-align:left}#gate p{font-size:13px;color:#bbb;line-height:1.6}#gate button{margin-top:12px;width:100%}@media(max-width:520px){.card{padding:32px 24px;border-radius:20px}}
</style></head><body><header><a href="/creative/discover"><strong>▱ VisualAgent</strong></a><a id="back" href="/creative/discover">返回创作 ↗</a></header><main class="card"><div class="brand">▱ VisualAgent</div><h1 id="title">邮箱登录</h1><section id="gate" hidden><p>本站目前为邀请访问，请先验证站点访问密码。</p><form id="gateForm"><input id="sitePassword" type="password" autocomplete="off" aria-label="站点访问密码" required><button>验证访问</button></form></section><form id="form"><label>邮箱<input id="email" type="email" autocomplete="username" maxlength="320" required placeholder="请输入邮箱"></label><label id="passwordLabel">密码<input id="password" type="password" autocomplete="current-password" maxlength="200" required placeholder="请输入密码"></label><label id="confirmLabel" hidden>确认密码<input id="confirm" type="password" autocomplete="new-password" maxlength="200"></label><label id="codeLabel" hidden>邮箱验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><button id="submit" class="submit">登录</button></form><p id="status" role="status" aria-live="polite"></p><div class="links"><button id="register">注册账户</button><button id="verify">验证邮箱</button><button id="resend" hidden>重新发送验证码</button></div><div class="methods" aria-label="其他登录方式"><button disabled title="微信登录服务尚未配置"><span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 10a7 6 0 1 0-10 5l-1 3 4-2M21 18l1 3-4-1a6 5 0 1 1 3-2Z"/><path d="M7 8h1m3 0h1m1 7h1m3 0h1"/></svg></span>微信扫码<small>暂未开通</small></button><button disabled title="短信登录服务尚未配置"><span>▯</span>手机号登录<small>暂未开通</small></button><button aria-current="true"><span>✉</span>邮箱登录</button></div></main>
<script>
'use strict';const $=id=>document.getElementById(id);let mode='login';
const requested=new URLSearchParams(location.search).get('return_to');let target='/creative/discover';try{const u=new URL(requested||target,location.origin);if(u.origin===location.origin&&['/creative','/creative/discover','/account','/management'].includes(u.pathname)){u.searchParams.delete('return_to');if(u.searchParams.get('view')==='login')u.searchParams.delete('view');target=u.pathname+u.search+u.hash}}catch{}$('back').href=target;
function draw(next){mode=next;$('title').textContent=mode==='login'?'邮箱登录':mode==='register'?'注册账户':'验证邮箱';$('submit').textContent=mode==='login'?'登录':mode==='register'?'注册':'验证邮箱';$('passwordLabel').hidden=mode==='verify';$('password').required=mode!=='verify';$('password').minLength=mode==='register'?7:1;$('password').autocomplete=mode==='register'?'new-password':'current-password';$('confirmLabel').hidden=mode!=='register';$('confirm').required=mode==='register';$('codeLabel').hidden=mode!=='verify';$('code').required=mode==='verify';$('resend').hidden=mode!=='verify';$('register').textContent=mode==='login'?'注册账户':'返回登录';$('status').textContent='';$('password').value='';$('confirm').value='';$('code').value=''}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});const d=await r.json().catch(()=>({}));if(!r.ok){if(d.detail==='Site access password required'){$('gate').hidden=false;throw Error('请先完成上方的站点访问验证。')}const messages={'Invalid credentials':'邮箱或密码不正确。','Email not verified':'请先验证邮箱。','Invalid or expired code':'验证码不正确或已过期。','Email delivery unavailable':'邮件服务暂不可用，请稍后重试。'};throw Error(messages[d.detail]||({429:'操作过于频繁，请稍后再试。',422:'请检查输入内容。',409:'该邮箱已注册，请登录。'}[r.status])||'暂时无法完成，请稍后重试。')}return d}
$('register').onclick=()=>draw(mode==='login'?'register':'login');$('verify').onclick=()=>draw('verify');
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='正在处理…';const email=$('email').value.trim();try{if(mode==='login'){const d=await request('/auth/login',{email,password:$('password').value});sessionStorage.setItem('h3_api_key',d.api_key);$('password').value='';location.replace(target)}else if(mode==='register'){if($('password').value!==$('confirm').value)throw Error('两次输入的密码不一致。');const d=await request('/auth/register',{email,password:$('password').value,password_confirm:$('confirm').value});draw(d.verification_required?'verify':'login');$('status').textContent=d.verification_required?'验证码已发送，请查看邮箱。':'注册成功，请登录。'}else{await request('/auth/verify',{email,code:$('code').value});draw('login');$('status').textContent='邮箱验证成功，请登录。'}}catch(e){$('status').textContent=e.name==='TimeoutError'?'请求超时，请稍后检查再试。':e.message}finally{$('submit').disabled=false}};
$('resend').onclick=async()=>{if(!$('email').reportValidity())return;$('resend').disabled=true;try{await request('/auth/resend',{email:$('email').value.trim()});$('status').textContent='如邮箱待验证，验证码将发送到该邮箱。'}catch(e){$('status').textContent=e.message}finally{$('resend').disabled=false}};
$('gateForm').onsubmit=async e=>{e.preventDefault();const b=$('gateForm').querySelector('button');b.disabled=true;try{await request('/site/access',{password:$('sitePassword').value});$('sitePassword').value='';$('gate').hidden=true;$('status').textContent='访问已验证，请继续登录。'}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
fetch('/site/config',{signal:AbortSignal.timeout(10000)}).then(async r=>{if(r.status===403)$('gate').hidden=false;else if(r.ok){const config=await r.json();if(config.registration==='direct')$('verify').hidden=true}}).catch(()=>{});
</script></body></html>
