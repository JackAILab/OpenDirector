<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisualAgent · 剪辑独立审阅</title><style>
@font-face{font-family:Studio;src:url('/creative/font.woff2')}*{box-sizing:border-box}body{margin:0;background:#101112;color:#eceff1;font:14px Studio,system-ui}header{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#17191b;border-bottom:1px solid #30343a}header h1{font-size:18px;margin:0}header a{color:#aeb8c2;text-decoration:none}.spacer{flex:1}main{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:290px 1fr;gap:18px}aside,section{background:#181a1d;border:1px solid #30343a;border-radius:14px;padding:18px}.queue{display:grid;gap:8px}.queue button{width:100%;text-align:left;padding:11px;background:#22262b;border:1px solid #3a4149;color:#e8ecef;border-radius:9px;cursor:pointer}.queue button:hover,.queue button.active{border-color:#5dd6f0}.muted{color:#95a0aa;line-height:1.7;font-size:12px}.hidden{display:none}h2{font-size:17px;margin:0 0 8px}h3{font-size:13px;margin:20px 0 8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}video{width:100%;max-height:520px;background:#070809;border-radius:10px}button,input,textarea,select{font:inherit}button{cursor:pointer;padding:9px 12px;border-radius:8px;border:1px solid #3a4149;background:#252a30;color:#e9eef2}button.primary{background:#5dd6f0;color:#08222a;border-color:transparent}button:disabled{opacity:.45;cursor:default}.rubric{display:grid;grid-template-columns:1fr 110px;gap:9px;margin:14px 0}.rubric textarea{grid-column:1/-1;min-height:54px}textarea,select{width:100%;padding:8px;background:#22262b;border:1px solid #3a4149;border-radius:7px;color:#e9eef2}.checks label{display:block;margin:11px 0}.task{padding:9px 10px;margin:7px 0;border:1px solid #30343a;background:#202328;border-radius:8px}.task strong{display:block}.window{margin:6px 6px 0 0;padding:5px 7px;font-size:11px}.status{min-height:22px}.video-meta{display:flex;gap:14px;flex-wrap:wrap;margin:7px 0}.video-meta span{color:#9aa5af;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}header{padding:0 14px}}
</style><header><h1>VisualAgent · 剪辑独立质量审阅</h1><span class="spacer"></span><a href="/creative">返回创作台</a></header><main><aside><h2>待审阅剪辑</h2><p class="muted">仅展示创作者已完成全片核对并明确提交的导出版本。审阅者不能是作品创建者。</p><div id="queue" class="queue"></div><p id="queueStatus" class="muted">正在读取…</p></aside><section><p id="status" class="status" role="status">请从左侧选择一个剪辑版本。</p><div id="body" class="hidden"><h2 id="title"></h2><div class="video-meta"><span id="version"></span><span id="qa"></span></div><video id="film" controls playsinline preload="metadata"></video><p id="mediaStatus" class="muted">请完整观看并听音。</p><h3>内容核对计划</h3><div id="tasks"></div><h3>独立质量评分</h3><p class="muted">每项填写实际看到或听到的依据。通过要求完整观看、听音、核对商品事实，且每项至少 3 分。</p><div id="ratings"></div><div class="checks"><label><input id="watched" type="checkbox"> 已完整观看成片</label><label><input id="heard" type="checkbox"> 已实际听过音轨并检查同步</label><label><input id="facts" type="checkbox"> 已对照商品资料核实事实与主张</label></div><div class="row"><select id="decision" aria-label="独立审阅结论"><option value="needs_changes">需要修改</option><option value="rejected">不通过</option><option value="passed">独立质量通过</option></select><button id="submit" class="primary">保存独立审阅</button></div><p id="existing" class="muted"></p></div></section></main><script>
const $=id=>document.getElementById(id),key=sessionStorage.getItem('h3_api_key')||'';const labels={product_fidelity:'商品外观与一致性',claim_accuracy:'卖点与事实准确性',narrative:'广告机制与叙事',visual_quality:'画面、动作与衔接',audio_quality:'旁白、音乐与音效'};let selected=null,epoch=0,url='';
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
async function api(path,method='GET',body){const r=await fetch('/creative/api/admin/learning/edit'+path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求未完成');return d}
async function loadQueue(){try{const d=await api('/queue');$('queue').replaceChildren();for(const item of d.items){const b=node('button',`${item.title} · ${item.status==='needs_changes'?'待修改':'待独立审阅'}`);b.onclick=()=>open(item);b.dataset.project=item.project;b.dataset.export=item.export_id;$('queue').append(b)}$('queueStatus').textContent=d.items.length?'选择版本后完整观看实际导出。':'当前没有待审阅的剪辑版本。'}catch(e){$('queueStatus').textContent=e.message}}
async function open(item){const token=++epoch;selected=null;$('body').classList.add('hidden');$('status').textContent='正在核对剪辑版本…';$('film').pause();$('film').removeAttribute('src');$('film').load();if(url)URL.revokeObjectURL(url);url='';try{const d=await api('/projects/'+item.project+'/exports/'+item.export_id);if(token!==epoch)return;selected=d;$('title').textContent=d.title;$('version').textContent=`导出 ${d.export_id.slice(0,12)} · 版本 ${d.revision} · ${d.artifact_sha256.slice(0,12)}`;$('qa').textContent=`技术检查：${d.qa.technical||'待检查'}`;$('tasks').replaceChildren();for(const task of d.content_tasks||[]){const box=node('div');box.className='task';box.append(node('strong',task.label+' · '+(task.instruction||'待核对')));for(const w of task.windows||[]){const b=node('button',`定位 ${Number(w.start).toFixed(2)}–${Number(w.end).toFixed(2)} 秒`);b.className='window';b.onclick=()=>{$('film').currentTime=Number(w.start);$('film').play().catch(()=>{})};box.append(b)}$('tasks').append(box)}$('ratings').replaceChildren();for(const id of d.rubric){const box=node('div');box.className='rubric';box.append(node('strong',labels[id]||id));const score=document.createElement('select');score.id='score-'+id;score.setAttribute('aria-label',labels[id]+'评分');score.append(new Option('请选择',''));for(let i=0;i<=5;i++)score.append(new Option(i+' 分',String(i)));const note=document.createElement('textarea');note.id='evidence-'+id;note.maxLength=500;note.placeholder='记录实际画面或声音依据';box.append(score,note);$('ratings').append(box)}for(const id of ['watched','heard','facts'])$(id).checked=false;$('decision').value='needs_changes';$('existing').textContent=d.assessment?'最新结论：'+d.assessment.decision:'尚无独立质量结论。';$('body').classList.remove('hidden');$('status').textContent='请完整观看、听音并核对商品事实。';const r=await fetch('/creative/api/admin/learning/edit/projects/'+item.project+'/exports/'+item.export_id+'/media?revision='+d.revision+'&digest='+d.artifact_sha256,{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error('视频暂不可读取');url=URL.createObjectURL(await r.blob());$('film').src=url;$('mediaStatus').textContent='视频已加载，建议使用全屏播放器逐项回看。'}catch(e){if(token===epoch)$('status').textContent=e.message}}
$('submit').onclick=async()=>{const d=selected;if(!d)return;const ratings={};for(const id of d.rubric){if(!$('score-'+id).value||$('evidence-'+id).value.trim().length<5){$('status').textContent='请填写每项评分和至少 5 字依据。';return}ratings[id]={score:Number($('score-'+id).value),evidence:$('evidence-'+id).value.trim()}}$('submit').disabled=true;try{const r=await api('/projects/'+d.project+'/exports/'+d.export_id+'/assessment','POST',{export_id:d.export_id,revision:d.revision,artifact_sha256:d.artifact_sha256,decision:$('decision').value,ratings,checks:{full_video_watched:$('watched').checked,audio_listened:$('heard').checked,product_facts_checked:$('facts').checked}});$('status').textContent='独立审阅已保存；training_eligible 仍为 false。';$('existing').textContent='最新结论：'+r.decision;await loadQueue()}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};loadQueue();
</script></html>
