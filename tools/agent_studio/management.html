<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · VisualAgent</title><style>
@font-face{font-family:Studio;src:url('/creative/font.woff2')}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px Studio,system-ui}header{padding:22px 30px;border-bottom:1px solid #333;display:flex;gap:24px;align-items:center}header strong{font-size:21px}header a{margin-left:auto}a{color:#7ddcef}main{max-width:1440px;margin:auto;padding:28px}button,input,textarea{font:inherit;color:inherit;background:#252525;border:1px solid #444;border-radius:8px;padding:10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}.card,section{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:20px}.card strong{display:block;font-size:28px;margin-top:12px}section{margin-top:24px}h2{margin-top:0;font-size:19px}.muted{color:#aaa;font-size:13px;line-height:1.7}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}td,th{padding:13px 10px;border-bottom:1px solid #333}td button{margin-right:8px}dialog{background:#202020;color:#eee;border:1px solid #555;border-radius:18px;width:min(960px,94vw);max-height:85vh}dialog::backdrop{background:#000b}dialog form{display:grid;gap:14px}dialog label{display:grid;gap:8px}#notice{color:#f3c48c;min-height:24px}[hidden]{display:none!important}.primary{background:#eee;color:#111}#auth{padding:80px;text-align:center}.close{float:right}.chart{display:flex;gap:4px;align-items:end;height:100px}.bar{background:#3bbdd6;min-width:12px;flex:1;border-radius:4px 4px 0 0}pre{white-space:pre-wrap}
</style></head><body><header><strong>VisualAgent 管理后台</strong><span id="identity"></span><a href="/creative/discover">返回创作</a><button id="logout" hidden>退出登录</button></header><main><div id="auth"><h1>管理员登录</h1><p>使用管理员邮箱账户登录后查看后台。</p><a href="/creative/login?return_to=%2Fmanagement">登录后台 →</a></div><div id="content" hidden><p id="notice" role="status"></p><div class="toolbar"><h1>运营概览</h1><button id="refresh">刷新数据</button></div><div class="cards" id="metrics"></div><section><h2>近 30 天活跃用户</h2><p class="muted">以登录用户打开创作页面的活动记录统计，北京时间；从本功能上线起记录。</p><div id="activity"></div></section><section><h2>待处理积分申请</h2><div id="requests" class="scroll"></div></section><section><h2>用户与积分</h2><form id="search" class="toolbar"><input id="query" aria-label="搜索邮箱" placeholder="搜索邮箱" maxlength="320"><button>查询</button><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button></form><div id="users" class="scroll"></div></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e},key=sessionStorage.getItem('h3_api_key');let offset=0;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(20000)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(r.status===401?'登录已失效，请重新登录。':r.status===403?'此账户没有管理员权限。':typeof d.detail==='string'?d.detail:'请求失败');return d}
function btn(label,fn){const b=el('button',label);b.type='button';b.onclick=fn;return b}function table(head,rows){const t=el('table'),h=el('tr');head.forEach(x=>h.append(el('th',x)));t.append(h);for(const cells of rows){const tr=el('tr');cells.forEach(x=>{const td=el('td');td.append(x instanceof Node?x:document.createTextNode(String(x??'—')));tr.append(td)});t.append(tr)}return t}const date=t=>t?new Date(t*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'尚无记录';
function dialog(title){const d=el('dialog');d.append(btn('关闭',()=>d.close()),el('h2',title));d.firstChild.className='close';d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();return d}
function allocate(user,req){const d=dialog('分配积分 · '+user.email),f=el('form'),amount=el('input'),reason=el('textarea'),status=el('p');amount.type='number';amount.min=1;amount.max=1000000;amount.required=true;amount.value=req?.amount||100;reason.required=true;reason.minLength=2;reason.maxLength=500;reason.value=req?'批准积分申请':'管理员分配';for(const [label,input]of [['增加积分（在现有总额度上累加）',amount],['分配说明',reason]]){const l=el('label',label);l.append(input);f.append(l)}const submit=el('button','确认分配');submit.className='primary';f.append(submit,status);d.append(f);let operation=crypto.randomUUID().replaceAll('-',''),snapshot=null;f.onsubmit=async e=>{e.preventDefault();const payload={user_id:user.id,amount:Number(amount.value),reason:reason.value,request_id:req?.id??null};const encoded=JSON.stringify(payload);if(snapshot&&snapshot!==encoded){status.textContent='上次提交结果尚未确认，请关闭后刷新数据核对。';return}snapshot=encoded;submit.disabled=true;amount.disabled=true;reason.disabled=true;try{await api('/management/api/allocate','POST',{...payload,operation_id:operation});d.close();await load()}catch(e){status.textContent=e.message+' 可用相同参数重试，系统会防止重复分配。';submit.disabled=false}}}
async function details(user){const d=dialog('用户记录 · '+user.email);try{const x=await api('/management/api/users/'+user.id);d.append(el('p','累计消耗：'+x.user.used+' 积分。图片与视频记录分别显示，历史记录可能不完整。'));d.append(el('h3','积分分配记录'),table(['时间','增加','说明'],x.allocations.map(v=>[date(v.created_at),v.amount,v.reason])));d.append(el('h3','视频积分流水'),table(['时间','积分变化','原因'],x.events.map(v=>[date(v.created_at),v.delta,v.reason])));d.append(el('h3','图片生成记录'),table(['项目','状态','占用积分'],x.images.map(v=>[v.project,v.state,v.state==='released'?0:v.credits])));d.append(el('h3','创作项目（仅后台元数据）'),table(['项目 ID','模式','状态','更新于'],x.projects.map(v=>[v.id,v.mode,v.state,date(v.updated_at)])));}catch(e){d.append(el('p',e.message))}}
function reject(req){const d=dialog('拒绝积分申请'),f=el('form'),reason=el('textarea'),status=el('p');reason.required=true;reason.minLength=2;reason.maxLength=500;reason.placeholder='填写拒绝原因';const s=el('button','确认拒绝');f.append(reason,s,status);d.append(f);f.onsubmit=async e=>{e.preventDefault();s.disabled=true;try{await api('/management/api/requests/'+req.id+'/reject','POST',{reason:reason.value});d.close();await load()}catch(e){status.textContent=e.message;s.disabled=false}}}
async function load(){try{$('notice').textContent='正在读取…';const [o,u,r]=await Promise.all([api('/management/api/overview'),api('/management/api/users?q='+encodeURIComponent($('query').value)+'&offset='+offset),api('/management/api/requests')]);$('metrics').replaceChildren(...[['总用户',o.users],['24 小时活跃',o.active_24h],['累计消耗积分',o.used],['创作项目',o.projects],['待审核申请',o.pending]].map(([k,v])=>{const c=el('div');c.className='card';c.append(el('span',k),el('strong',v));return c}));$('activity').replaceChildren();if(!o.daily.length)$('activity').append(el('p','尚无活动记录'));else{const chart=el('div');chart.className='chart';const max=Math.max(...o.daily.map(x=>x.users),1);for(const day of [...o.daily].reverse()){const bar=el('div');bar.className='bar';bar.style.height=Math.max(5,day.users/max*100)+'%';bar.title=day.day+'：'+day.users+' 人';chart.append(bar)}$('activity').append(chart,table(['日期','活跃用户'],o.daily.map(x=>[x.day,x.users])))}$('requests').replaceChildren(r.requests.length?table(['邮箱','申请积分','用途','申请时间','操作'],r.requests.map(v=>{const actions=el('div');actions.append(btn('批准 / 调整',()=>allocate({id:v.user_id,email:v.email},v)),btn('拒绝',()=>reject(v)));return[v.email,v.amount,v.reason,date(v.created_at),actions]})):el('p','暂无待处理申请'));$('users').replaceChildren(table(['邮箱','角色','总额度','已用','剩余','最近活跃','操作'],u.users.map(v=>{const actions=el('div');const grant=btn('分配积分',()=>allocate(v));grant.disabled=v.quota<0;actions.append(grant,btn('消耗与项目',()=>details(v)));return[v.email,v.role,v.quota<0?'无限':v.quota,v.used,v.quota<0?'无限':v.quota-v.used,date(v.last_seen),actions]})));$('prev').disabled=offset===0;$('next').disabled=u.users.length<50;$('notice').textContent='更新于 '+new Date().toLocaleTimeString();}catch(e){$('notice').textContent=e.message}}
$('search').onsubmit=e=>{e.preventDefault();offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{offset+=50;load()};$('refresh').onclick=load;$('logout').onclick=async()=>{try{await api('/auth/revoke','POST');sessionStorage.removeItem('h3_api_key');location.reload()}catch(e){$('notice').textContent=e.message}};
(async()=>{if(!key)return;try{const me=await api('/me');if(me.role!=='admin'){ $('auth').replaceChildren(el('h1','无后台访问权限'),el('p','请使用管理员账户登录。'));return}$('identity').textContent=me.email;$('auth').hidden=true;$('content').hidden=false;$('logout').hidden=false;await load()}catch(e){$('auth').append(el('p',e.message))}})();
</script></body></html>
