<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>VisualAgent iPhone 18 概念直播预演</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="live-room.css">
</head>
<body>
  <main id="iphone18-live" class="composition" data-composition-id="iphone18-concept-live-60s-v1" data-width="1080" data-height="1920" data-start="0" data-duration="60" data-fps="30" data-hf-id="hf-iphone18-root">
    <div class="camera-placeholder" aria-label="神经相机画面尚未生成">
      <div class="studio-glow"></div>
      <div class="host-block" data-layout-allow-overlap><span data-layout-allow-occlusion>HOST CAMERA</span><b data-layout-allow-occlusion>OMNI CAMERA PLATE<br>PENDING</b><small data-layout-allow-occlusion data-layout-allow-overlap>人物、概念设备、物理柜台与动作将在付费预算明确后生成</small></div>
      <div class="device-demo" aria-hidden="true"><i class="phone slab"></i><i class="phone fold"><em></em></i></div>
    </div>
    <div class="grade" aria-hidden="true" data-layout-ignore></div>

    <header class="topbar">
      <div class="identity"><span class="avatar">VA</span><div><h1 id="room-name"></h1><p id="room-subtitle"></p></div></div>
      <div class="live"><i></i>LIVE</div><div class="viewers"><span>◉</span><b id="viewer-count">12.8K</b></div>
    </header>
    <div class="disclosure"><b>AI</b><span id="disclosure-text"></span></div>
    <div class="prelaunch" id="prelaunch-text"></div>

    <section id="pinned-question" class="pinned-question"><small id="pinned-label"></small><strong></strong></section>
    <section id="comments" class="comments" aria-label="直播弹幕"></section>
    <aside class="actions" aria-label="直播操作"><div><button>♡</button><span id="like-label"></span></div><div><button>↗</button><span id="share-label"></span></div><div><button>◷</button><span id="remind-label"></span></div></aside>

    <article id="fact-card" class="fact-card"><small></small><h2></h2><p></p><b id="fact-state"></b></article>
    <section id="gift-stage" class="gift-stage" aria-label="代码生成礼物特效" data-layout-allow-overlap><div class="gift-orbit"><i></i><i></i><i></i><b data-layout-allow-overlap>✦</b></div><div class="gift-copy"><small></small><strong></strong></div></section>
    <div id="subtitle" class="subtitle"></div>

    <footer class="commerce-drawer"><div class="product-thumb"><i></i></div><div><small id="drawer-kicker"></small><strong id="drawer-title"></strong><span id="drawer-copy"></span></div><button id="drawer-cta"></button></footer>
    <div class="composer"><span id="composer-placeholder"></span><button>☺</button><button>♡</button></div>
    <div class="progress"><i id="progress-bar"></i></div>
  </main>
  <script>window.__timelines = window.__timelines || {}; window.__timelines["iphone18-concept-live-60s-v1"] = null;</script>
  <script type="module" src="live-room.js"></script>
</body>
</html>
