<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>源片事件与关系标注</title><style>
body{font:16px/1.6 "Noto Sans CJK SC",system-ui,sans-serif;background:#f5f6f2;color:#24372b;max-width:1000px;margin:30px auto;padding:0 20px}article{background:white;border:1px solid #cbd5c8;border-radius:12px;padding:20px;margin:24px 0}video{width:100%;max-height:450px;background:#17231c}label{display:block;margin:12px 0}textarea,input,select,button{font:inherit;padding:8px;box-sizing:border-box}textarea{width:100%;min-height:75px}button{cursor:pointer;margin:6px}fieldset{margin:12px 0;border:1px solid #ccd5c8}input[type=number]{width:110px}small{display:block;color:#566854}
</style><h1>源片事件与关系标注</h1>
<p>请先独立看片，再记录证据。这里不展示机器解析、候选配对或目标商品。片中品牌无法隐藏。不要把事件先后自动解释为因果。</p>
<p>完整看过与听过由你确认；页面不把播放结束当作认真评审的证明。可以记录“无法判断”。所有导出均为待核查标注，不自动成为标准答案或训练数据。</p>
<label>匿名评审编号（不要填写姓名或联系方式）<input id="reviewer" maxlength="40" placeholder="如 reviewer-01"></label>
<main id="clips"></main><button id="draft">下载草稿</button><button id="done">检查并下载完整标注</button><p id="status" role="status"></p>
<script>
const bundle=__PACKET_DATA__;
const text=(tag,value)=>{let e=document.createElement(tag);e.textContent=value;return e};
function field(parent,title,name,type='textarea',options=[]){let l=text('label',title),e=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');e.dataset.key=name;if(type==='checkbox'||type==='number')e.type=type;if(type==='number'){e.min=0;e.step='0.01'}if(type==='select')for(let v of ['',...options]){let o=text('option',v||'请选择');o.value=v;e.append(o)}l.append(e);parent.append(l);return e}
const containers=[];
for(const clip of bundle.packet.clips){const a=document.createElement('article');a.append(text('h2',clip.label));const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=clip.media;a.append(v);field(a,'我已完整观看','watched','checkbox');field(a,'声音情况','audio','select',['已完整听过','播放无声','无法播放声音']);field(a,'该素材的内容类型','role','select',['原始广告','案例解说','混合内容','无法判断']);
 const events=document.createElement('div'),relations=document.createElement('div');a.append(text('h3','一、可观察事件'),events);let n=0;
 const addEvent=()=>{n++;const f=document.createElement('fieldset');f.dataset.eventId='E'+n;f.append(text('legend','E'+n));field(f,'开始秒','start','number');field(f,'结束秒','end','number');field(f,'证据模态','modality','select',['视觉','声音','视听共同']);field(f,'直接看见或听见的内容（不写推测）','observation');events.append(f)};
 let b=text('button','＋ 添加事件');b.onclick=addEvent;a.append(b);addEvent();
 a.append(text('h3','二、关系解释'),text('small','无法可靠解释时可以不添加关系；请在末尾说明原因。关系必须引用上面的事件编号。'),relations);
 b=text('button','＋ 添加关系');b.onclick=()=>{const f=document.createElement('fieldset');field(f,'相关事件编号，用逗号分隔，如 E1,E2','events','input');field(f,'关系类型','kind','select',['时间先后','人物反应','叙事归因','能力主张','其他']);field(f,'你的关系解释','interpretation');field(f,'证据状态','support','select',['直接观察','有依据的解释','无法确定']);field(f,'其他可能解释、缺失证据及适用边界','alternatives');relations.append(f)};a.append(b);
 field(a,'传播目标（不确定可说明）','goal');field(a,'总体不确定性；若无关系标注，请说明原因','uncertainty');document.getElementById('clips').append(a);containers.push({a,events,relations,clip})}
function values(parent){return Object.fromEntries([...parent.querySelectorAll('[data-key]')].filter(e=>!e.closest('fieldset')).map(e=>[e.dataset.key,e.type==='checkbox'?e.checked:e.value.trim()]))}
function rowValues(f){return Object.fromEntries([...f.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.type==='number'?(e.value===''?null:Number(e.value)):e.value.trim()]))}
function collect(){return containers.map(({a,events,relations,clip})=>({label:clip.label,...values(a),events:[...events.children].map(f=>({id:f.dataset.eventId,...rowValues(f)})),relations:[...relations.children].map(f=>{let r=rowValues(f);r.events=r.events.split(/[,，]/).map(x=>x.trim()).filter(Boolean);return r})}))}
function errors(rows){let errs=[];for(const r of rows){const duration=bundle.packet.clips.find(c=>c.label===r.label).duration;if(!r.watched||!r.audio||!r.role||!r.goal||!r.uncertainty)errs.push(r.label+'：请完成观看确认及总体字段');for(const e of r.events)if(e.start===null||e.end===null||!Number.isFinite(e.start)||!Number.isFinite(e.end)||e.start<0||e.end<=e.start||e.end>duration+0.25||!e.modality||!e.observation)errs.push(r.label+' '+e.id+'：检查时间范围及观察内容');let ids=new Set(r.events.map(e=>e.id));for(const rel of r.relations)if(!rel.events.length||rel.events.some(id=>!ids.has(id))||!rel.kind||!rel.interpretation||!rel.support||!rel.alternatives)errs.push(r.label+'：检查关系字段及事件引用')}return errs}
function download(complete){const rows=collect(),reviewer=document.getElementById('reviewer').value.trim();let es=errors(rows);if(!/^[A-Za-z0-9_-]{1,40}$/.test(reviewer))es.unshift('请填写仅含字母、数字、下划线或短横线的匿名编号');if(complete&&es.length){document.getElementById('status').textContent=es.join('；');return}const result={schema:'visualagent.source-relation-review.v1',packet_sha256:bundle.packet_sha256,reviewer_code:reviewer,review_status:complete?'submitted_unverified':'draft',independence_status:'not_verified',training_eligible:false,clips:rows};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='source-relation-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已下载。请保留文件；页面没有上传或批准结果。'}
document.getElementById('draft').onclick=()=>download(false);document.getElementById('done').onclick=()=>download(true);
</script></html>
