<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告方案与参考关系评审</title>
<style>body{font:16px/1.6 "Noto Sans CJK SC",system-ui,sans-serif;color:#24372b;background:#f5f6f2;max-width:1100px;margin:30px auto;padding:0 20px}article,fieldset{background:white;border:1px solid #ced7ca;border-radius:10px;padding:20px;margin:18px 0}label{display:block;margin:12px 0}textarea{display:block;width:95%;min-height:75px}select,input,textarea,button{font:inherit;padding:8px}video{width:100%;max-height:400px;background:#18251c}button{margin:10px 0;cursor:pointer}pre{white-space:pre-wrap}#stage2[hidden]{display:none}</style>
<h1>广告方案与参考关系评审</h1><p>第一步先评方案，第二步再看参考。方案顺序和参考编号已打乱，不显示模型策略或实际使用的参考。编号不暗示对应关系。页面不联网提交。</p>
<label>匿名评审编号<input id="reviewer" maxlength="40" placeholder="reviewer-01"></label>
<p>评价计划文本，不评价尚未生成的视频画质；同时留意画面、字幕和声音中的暗示。允许“无法判断”。</p><p>可用性锚点：1＝无法据此制作；2＝需大幅重写；3＝补齐明显细节后可制作；4＝仅需小修改；5＝可直接进入制作规划。事实正确与可制作性分别评分。</p><form id="stage1"></form><button id="lock">锁定第一步评分，打开参考关系评审</button>
<section id="stage2" hidden><h2>第二步：逐一对照两段源片</h2><p>所有方案都与两段源片比较，包括看起来没有关系的组合。区分叙事关系与色调、物件等表层相似。请说明源片时间段和方案镜头；不要仅因商品不同就判无关。</p><div id="sources"></div><form id="relations"></form></section>
<button id="draft">下载当前草稿</button><button id="submit">检查并下载完整评审</button><p id="status" role="status"></p>
<script>
const bundle=__PACKET_DATA__;let locked=null;
const el=(tag,value)=>{const e=document.createElement(tag);e.textContent=value;return e};
function field(parent,title,name,options){const l=el('label',title),e=document.createElement(options?'select':'textarea');e.name=name;if(options){for(const v of ['',...options]){const o=el('option',v||'请选择');o.value=v;e.append(o)}}l.append(e);parent.append(l)}
for(const p of bundle.packet.plans){const a=document.createElement('article');a.append(el('h2',p.label),el('p',p.task.brief));const facts=document.createElement('details');facts.append(el('summary','本方案全部已披露商品事实'),el('pre',JSON.stringify(p.task.facts,null,2)));a.append(facts,el('p',p.plan.claim));for(const s of p.plan.shots){a.append(el('h3',`${s.start}–${s.end} 秒`));for(const [k,t] of [['visual','画面'],['audio','声音'],['caption','字幕']])a.append(el('p',t+'：'+(s[k]||'（无）')))}a.append(el('p','未决事项：'+p.plan.unresolved.join('；')));field(a,'是否包含未经已披露商品事实支持的承诺？',p.label+'_violation',['有','无','无法判断']);field(a,'是否保留客户传播目标？',p.label+'_goal',['是','部分','否','无法判断']);field(a,'作为制作计划的可用性（1最低，5最高）',p.label+'_utility',['1','2','3','4','5','无法判断']);field(a,'依据：指出具体镜头、事实和可制作性问题',p.label+'_evidence');document.getElementById('stage1').append(a)}
function fields(id){return Object.fromEntries(new FormData(document.getElementById(id)))}
function complete(data){return Object.values(data).every(v=>String(v).trim())}
function unlock(){const values=fields('stage1');if(!complete(values)){document.getElementById('status').textContent='请完成每份方案的第一步评分及依据。';return}locked=structuredClone(values);document.querySelectorAll('#stage1 select,#stage1 textarea').forEach(e=>e.disabled=true);document.getElementById('lock').disabled=true;document.getElementById('stage2').hidden=false;
for(const s of bundle.packet.sources){const a=document.createElement('article');a.append(el('h3',s.label));const v=document.createElement('video');v.src=s.media;v.controls=true;v.preload='metadata';a.append(v);document.getElementById('sources').append(a);field(document.getElementById('relations'),'源片 '+s.label+' 观看与声音状态',s.label+'_view',['完整观看并听取','完整观看但声音无法判断','尚未完整观看'])}
for(const p of bundle.packet.plans){const a=document.createElement('fieldset');a.append(el('legend','方案 '+p.label));for(const s of bundle.packet.sources){field(a,`与 ${s.label} 的关系`,p.label+'_'+s.label+'_relation',['保留具体叙事关系','仅表层或通用结构相似','未发现对应关系','无法判断']);field(a,`判断依据：${s.label}时间段、事件关系与${p.label}镜头；可记录替代解释`,p.label+'_'+s.label+'_evidence')}document.getElementById('relations').append(a)}document.getElementById('status').textContent='第一步已锁定。第二步不会覆盖原评分。'}
function save(done){const reviewer=document.getElementById('reviewer').value.trim(),a=locked||fields('stage1'),b=fields('relations');if(done&&(!locked||!complete(b)||Object.values(b).includes('尚未完整观看')||!/^[A-Za-z0-9_-]{1,40}$/.test(reviewer))){document.getElementById('status').textContent='请锁定第一步、完成观看和全部关系评分，并填写匿名编号。';return}const result={schema:'visualagent.reference-plan-review.v1',packet_sha256:bundle.packet_sha256,reviewer_code:reviewer,stage1_locked:!!locked,stage1:a,stage2:b,review_status:done?'submitted_unverified':'draft',independence_status:'not_verified',training_eligible:false};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='reference-plan-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已下载；未上传或自动批准。'}
document.getElementById('lock').onclick=unlock;document.getElementById('draft').onclick=()=>save(false);document.getElementById('submit').onclick=()=>save(true);
</script></html>
