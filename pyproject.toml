[project]
name = "visualagent-harness"
version = "0.2.0"
description = "Evidence-first agent and tool-calling harness for visual production"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
studio = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2", "uvicorn>=0.30"]
live = ["edge-tts>=7", "imageio-ffmpeg>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["harness*"]
